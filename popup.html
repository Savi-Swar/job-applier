<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; color: #1a1a1a; }
  @media (prefers-color-scheme: dark) {
    body { background: #10131c; color: #e8ebf3; }
    button.secondary { background: #1d2942; color: #8fb0fa; }
    select, .skill { background: #181d2a; color: #e8ebf3; border-color: #262c3d; }
    .muted, .legend { color: #9aa3b5; }
    #analysis h3 { color: #9aa3b5; }
  }
  h1 { font-size: 15px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #1a6feb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #9bb8e8; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  button.secondary { background: #eef2f8; color: #1a4d9e; font-weight: 500; font-size: 13px; }
  #analysis { font-size: 12px; }
  #analysis h3 { font-size: 12px; margin: 10px 0 4px; color: #555; }
  .skill { display: inline-block; background: #e3edfd; color: #1a4d9e; border-radius: 10px; padding: 1px 8px; margin: 2px 2px 0 0; font-size: 11px; }
  .skill.nice { background: #f0f0f0; color: #555; }
  .skill.buzz { background: #efe6fb; color: #6425b8; }
  label.ai { display: flex; gap: 6px; align-items: center; margin: 10px 0; }
  #status { margin-top: 10px; white-space: pre-wrap; }
  .ok { color: #1b7f45; }
  .warn { color: #b06000; }
  .err { color: #c0392b; }
  a { color: #1a6feb; }
  .legend { margin-top: 8px; font-size: 12px; color: #666; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
  <h1>Job Applier</h1>
  <div id="resumeRow" style="display:none; margin-bottom:8px">
    <label style="font-size:12px; color:#666">Resume to attach</label>
    <select id="resumePick" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:6px; font-size:13px"></select>
  </div>
  <button id="fill">Fill this page</button>
  <div class="row">
    <button id="markApplied" class="secondary">✓ Mark applied</button>
    <button id="trackOnly" class="secondary">＋ Track only</button>
  </div>
  <div class="row">
    <button id="analyze" class="secondary" style="width:100%">🔍 Analyze posting — skills &amp; buzzwords</button>
  </div>
  <div id="analysis"></div>
  <label class="ai"><input type="checkbox" id="useAI" checked> Draft free-text answers with AI</label>
  <label class="ai"><input type="checkbox" id="autoFill" checked> Auto-fill when I open a job page</label>
  <div class="legend">
    <span class="sw" style="background:#22a55b"></span>from profile&nbsp;&nbsp;
    <span class="sw" style="background:#e8961e"></span>AI draft — review it!
  </div>
  <div id="status"></div>
  <p style="margin-bottom:0">
    <a href="#" id="openDashboard">Dashboard: feed &amp; tracker</a> ·
    <a href="#" id="openOptions">Profile &amp; API key</a>
  </p>
  <script src="popup.js"></script>
</body>
</html>
